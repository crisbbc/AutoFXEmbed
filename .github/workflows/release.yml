name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        # The in-app updater (src/update.rs) finds assets by these exact names.
        include:
          - os: ubuntu-latest
            binary: target/release/autofxembed
            asset: autofxembed-linux-x86_64
          - os: windows-latest
            binary: target/release/autofxembed.exe
            asset: autofxembed-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  android:
    runs-on: ubuntu-latest
    steps:
      # Without the signing key, skip Android rather than failing the release.
      - id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; skipping the Android APK"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
      - if: steps.key.outputs.skip != 'true'
        uses: actions/checkout@v5
      - if: steps.key.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - if: steps.key.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.key.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: steps.key.outputs.skip != 'true'
        run: |
          cargo install cargo-ndk --locked
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.16248370"
      - if: steps.key.outputs.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      # The in-app updater (Updater.java) finds the APK by this exact name.
      - if: steps.key.outputs.skip != 'true'
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/autofxembed-android.apk
      - if: steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autofxembed-android.apk
          path: dist/autofxembed-android.apk
  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/autofxembed-linux-x86_64
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
